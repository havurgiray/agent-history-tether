name: release

# Tag vX.Y.Z (matching VERSION in aht.py) to build every artifact and publish
# a GitHub release; run it by hand (workflow_dispatch) to build and test the
# artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# one run per tag at a time: two runs of one tag (GitHub delivered the push
# twice for v0.12.0) otherwise race, and each uploads its own builds
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' aht.py)" >> "$GITHUB_OUTPUT"
      - name: build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.*"
          python windows/src/make_icons.py windows/app.ico
          cd windows
          python -m PyInstaller --clean -y --distpath dist --workpath build aht.spec
      - name: smoke test the real exe
        shell: bash
        env:
          AHT_SMOKE_NATIVE: "1"
        run: |
          sh windows/tests/wine_smoke.sh "$PWD/windows/dist/aht/aht.exe"
          sh windows/tests/wine_watch_smoke.sh "$PWD/windows/dist/aht/aht.exe"
          sh windows/tests/features_smoke.sh "$PWD/windows/dist/aht/aht.exe"
      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item -Recurse windows/dist/aht/* pkg/
          Copy-Item LICENSE, README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "aht-${{ steps.v.outputs.version }}-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: aht-*-windows-*.zip
          if-no-files-found: error

  installer:
    name: Windows installers
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: windows-*
          path: zips
          merge-multiple: true
      - name: build both installers
        shell: pwsh
        run: |
          $v = (Select-String -Path aht.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          "AHT_VERSION=$v" >> $env:GITHUB_ENV
          $iscc = windows/iscc.ps1
          if (-not $iscc) { exit 1 }
          python windows/src/make_icons.py windows/app.ico
          foreach ($arch in "x64", "arm64") {
            Expand-Archive "zips/aht-$v-windows-$arch.zip" "build/$arch"
            & $iscc /Q "/DAppVersion=$v" "/DArch=$arch" "/DSrc=$PWD\build\$arch" windows/aht.iss
            if ($LASTEXITCODE) { exit 1 }
          }
          Get-ChildItem windows/installer
      - name: install, check and remove the x64 installer
        shell: pwsh
        run: windows/tests/installer_smoke.ps1 -Installer "windows/installer/aht-setup-$env:AHT_VERSION-windows-x64.exe" -Version $env:AHT_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: windows/installer/aht-setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: build, sign (ad-hoc) and selftest
        run: macos/build_app.sh --test
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: macos/build/aht-*-macos-*.zip
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [windows, installer, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: the tag must match VERSION in aht.py
        run: |
          v="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' aht.py)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: .github/release-notes.md
          generate_release_notes: true
