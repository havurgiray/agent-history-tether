name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core tests (${{ matrix.os }}, python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: rsync 3 for the handover tests (macOS ships an older one)
        if: runner.os == 'macOS'
        run: brew install rsync
      - name: run the suites
        run: AHT_PY="$(command -v python)" tests/run_tests.sh

  windows-transfer:
    # aht's own copy on Windows itself, from source: the copy between this
    # machine and a folder that stands in for another (test mode: the far
    # end runs here, no ssh, no sh), and the far end fed on stdin
    name: aht's own copy on Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: the handover suite's copy, in test mode
        shell: bash
        run: python tests/core_test.py --transport
      - name: the far end, asked on stdin (probe, manifest, pack, unpack, a file held open)
        shell: bash
        run: python windows/tests/agent_smoke.py

  macos-app:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: build and selftest
        run: macos/build_app.sh --host-only --test

  windows:
    name: Windows exe (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: build
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller==6.*"
          python windows/src/make_icons.py windows/app.ico
          cd windows
          python -m PyInstaller --clean -y --distpath dist --workpath build aht.spec
      - name: smoke test the real exe
        shell: bash
        env:
          AHT_SMOKE_NATIVE: "1"
        run: |
          sh windows/tests/wine_smoke.sh "$PWD/windows/dist/aht/aht.exe"
          sh windows/tests/wine_watch_smoke.sh "$PWD/windows/dist/aht/aht.exe"
          sh windows/tests/features_smoke.sh "$PWD/windows/dist/aht/aht.exe"
      - name: the exe as the far end of aht's own copy (probe, manifest, pack, unpack)
        shell: bash
        run: python windows/tests/agent_smoke.py "$PWD/windows/dist/aht/aht.exe"
      - name: the badge cache, a drawn badge replaced on the next refresh, and the entry point
        shell: bash
        run: |
          python windows/tests/winbadge_test.py
          python windows/tests/aht_main_test.py
      - name: the installer, installed and removed
        shell: pwsh
        run: |
          $v = (Select-String -Path aht.py -Pattern '^VERSION = "(.*)"').Matches[0].Groups[1].Value
          $iscc = windows/iscc.ps1
          if (-not $iscc) { exit 1 }
          & $iscc /Q "/DAppVersion=$v" "/DArch=${{ matrix.arch }}" windows/aht.iss
          if ($LASTEXITCODE) { exit 1 }
          windows/tests/installer_smoke.ps1 -Installer "windows/installer/aht-setup-$v-windows-${{ matrix.arch }}.exe" -Version $v
